[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "puff-coordination"
version = "0.1.0"
description = "Coordinate validated summaries from independent Puff session agents"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = ["flwr==1.39.0", "openai>=2.16.0,<3.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.flwr.app]
publisher = "puff-local"
flwr-version-target = "1.39.0"

[tool.flwr.app.components]
agentapp = "agent.agent_app:app"

[tool.flwr.app.config]
model = "openai/gpt-5.6-sol"
