[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "puff-guardian"
version = "0.1.0"
description = "Puff guardian: one Flower agent per coding agent that shares source-cited findings between agents over a shared board"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = ["flwr==1.39.0", "openai>=2.16.0,<3.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.flwr.app]
publisher = "puff-local"
flwr-version-target = "1.39.0"

[tool.flwr.app.components]
agentapp = "agent.agent_app:app"

[tool.flwr.app.config]
model = "flower-endeavor-v1.0"
fallback-model = "openai/gpt-5.6-sol"
